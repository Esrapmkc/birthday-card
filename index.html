<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Birthday Card Surprise</title>
  <meta name="description" content="Click the envelope to reveal a birthday card message with confetti and sound." />
  <link rel="preload" href="assets/bg.png" as="image">
  <link rel="preload" href="assets/pop.mp3" as="audio">
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <div class="sparkles" aria-hidden="true"></div>

  <main class="stage">
    <header class="top">
      <div class="pill" id="hint">Tap / Click the envelope ✨</div>
    </header>

    <section class="scene" aria-label="Birthday surprise scene">
      <!-- Cake -->
      <div class="cake-wrap" aria-hidden="true">
        <svg class="cake" viewBox="0 0 520 420" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="frost" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0" stop-color="rgba(255,255,255,.98)"/>
              <stop offset="1" stop-color="rgba(255,255,255,.78)"/>
            </linearGradient>

            <linearGradient id="tierPink" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0" stop-color="rgba(255,155,190,.98)"/>
              <stop offset="1" stop-color="rgba(255,95,155,.96)"/>
            </linearGradient>

            <linearGradient id="tierBlue" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0" stop-color="rgba(160,230,255,.98)"/>
              <stop offset="1" stop-color="rgba(90,190,255,.95)"/>
            </linearGradient>

            <linearGradient id="tierLav" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0" stop-color="rgba(240,200,255,.98)"/>
              <stop offset="1" stop-color="rgba(210,150,255,.96)"/>
            </linearGradient>

            <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
              <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="rgba(0,0,0,.18)"/>
            </filter>

            <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur stdDeviation="2" result="b"/>
              <feMerge>
                <feMergeNode in="b"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>

          <ellipse cx="260" cy="370" rx="220" ry="36" fill="rgba(255,255,255,.62)" filter="url(#softShadow)"/>

          <g filter="url(#softShadow)">
            <rect x="85" y="210" width="350" height="140" rx="34" fill="url(#tierPink)"/>
            <path d="M120 228 C155 270 190 185 225 228 C260 270 295 185 330 228 C365 270 400 185 435 228"
                  transform="translate(-22,0)"
                  fill="none" stroke="url(#frost)" stroke-width="26" stroke-linecap="round" opacity=".96"/>
            <circle cx="145" cy="296" r="7" fill="rgba(255,255,255,.96)"/>
            <circle cx="205" cy="314" r="6" fill="rgba(255,255,255,.96)"/>
            <circle cx="270" cy="297" r="7" fill="rgba(255,255,255,.96)"/>
            <circle cx="332" cy="315" r="6" fill="rgba(255,255,255,.96)"/>
            <circle cx="395" cy="296" r="7" fill="rgba(255,255,255,.96)"/>
          </g>

          <g filter="url(#softShadow)">
            <rect x="130" y="126" width="260" height="104" rx="28" fill="url(#tierBlue)"/>
            <path d="M165 150 C195 185 225 120 255 150 C285 185 315 120 345 150 C375 185 405 120 435 150"
                  transform="translate(-55,0)"
                  fill="none" stroke="rgba(255,255,255,.96)" stroke-width="20" stroke-linecap="round" opacity=".96"/>
          </g>

          <g filter="url(#softShadow)">
            <rect x="172" y="62" width="176" height="84" rx="26" fill="url(#tierLav)"/>
            <path d="M205 90 C230 112 255 64 280 90 C305 112 330 64 355 90"
                  transform="translate(-18,0)"
                  fill="none" stroke="rgba(255,255,255,.96)" stroke-width="18" stroke-linecap="round" opacity=".96"/>
          </g>

          <g filter="url(#glow)">
            <rect x="228" y="22" width="12" height="60" rx="6" fill="rgba(255,255,255,.95)"/>
            <rect x="254" y="14" width="12" height="68" rx="6" fill="rgba(255,255,255,.95)"/>
            <rect x="280" y="22" width="12" height="60" rx="6" fill="rgba(255,255,255,.95)"/>
            <path d="M234 20 C228 10 242 10 236 20" fill="rgba(255,200,90,.98)"/>
            <path d="M260 12 C254 2 268 2 262 12" fill="rgba(255,200,90,.98)"/>
            <path d="M286 20 C280 10 294 10 288 20" fill="rgba(255,200,90,.98)"/>
          </g>
        </svg>
      </div>

      <!-- Envelope (will disappear after click) -->
      <div class="envelope-wrap" id="envelopeWrap">
        <button class="envelope" id="envelope" type="button" aria-label="Open the birthday card">
          <div class="env-shadow"></div>

          <div class="env-body">
            <div class="env-back"></div>
            <div class="env-front"></div>
            <div class="env-flap"></div>
          </div>
        </button>
      </div>

      <!-- Card (shows after click) -->
      <div class="card-wrap" id="cardWrap" aria-hidden="true">
        <div class="card" role="dialog" aria-label="Birthday message card">
          <div class="card-bg-decor" aria-hidden="true"></div>

          <div class="card-header">
            <div class="header-badge">🎉</div>
            <div class="header-text">
              <div class="header-title">Happy Birthday!</div>
              <div class="header-sub">A little surprise just for you</div>
            </div>
          </div>

          <div class="card-wave" aria-hidden="true">
            <svg viewBox="0 0 600 90" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M0,30 C90,70 160,5 250,35 C340,65 410,20 505,40 C560,52 590,60 600,62 L600,0 L0,0 Z"
                    fill="rgba(70,150,230,.18)"/>
              <path d="M0,48 C95,80 170,18 260,46 C350,74 425,30 520,52 C565,62 590,68 600,72 L600,0 L0,0 Z"
                    fill="rgba(70,150,230,.12)"/>
            </svg>
          </div>

          <div class="message" id="msg">
            Wishing you a day full of smiles, surprises, and sweet moments. 💛
          </div>

          <div class="from" id="from">— Someone who cares</div>

          <div class="card-footer">
            <span>🧁</span><span>✨</span><span>🎂</span><span>🎈</span><span>💙</span>
          </div>
        </div>
      </div>

      <audio id="pop" src="assets/pop.mp3" preload="auto"></audio>
    </section>

    <footer class="bottom">
      <div class="small">Made for instant digital gifting • Works on mobile & desktop</div>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
