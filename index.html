<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Make a Wish 🎂</title>
  <meta name="description" content="Make a wish countdown, blow out candles, sparkle burst, then open an envelope for a birthday card." />
  <link rel="preload" href="assets/bg.png" as="image">
  <link rel="preload" href="assets/pop.mp3" as="audio">
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!-- One canvas for confetti + sparkle bursts -->
  <canvas id="fx" aria-hidden="true"></canvas>

  <!-- Always-on glitter overlay -->
  <div class="sparkles" aria-hidden="true"></div>

  <main class="stage">
    <header class="top">
      <div class="pill" id="hint">Watch the candles… then make a wish ✨</div>
    </header>

    <section class="scene" aria-label="Birthday wish scene">
      <!-- CAKE + WISH INTRO -->
      <section class="intro" id="intro" aria-label="Make a wish countdown">
        <div class="wish-title">MAKE A WISH</div>

        <div class="countdown" aria-label="Countdown timer">
          <span class="count-num" id="countNum">5</span>
          <span class="count-s">s</span>
        </div>

        <div class="cake-wrap" aria-hidden="true">
          <!-- Cake SVG (big & vivid) -->
          <svg class="cake" viewBox="0 0 560 460" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="tierPink" x1="0" x2="0" y1="0" y2="1">
                <stop offset="0" stop-color="rgba(255,160,200,.98)"/>
                <stop offset="1" stop-color="rgba(255,95,160,.96)"/>
              </linearGradient>
              <linearGradient id="tierBlue" x1="0" x2="0" y1="0" y2="1">
                <stop offset="0" stop-color="rgba(170,235,255,.98)"/>
                <stop offset="1" stop-color="rgba(95,200,255,.95)"/>
              </linearGradient>
              <linearGradient id="tierLav" x1="0" x2="0" y1="0" y2="1">
                <stop offset="0" stop-color="rgba(245,210,255,.98)"/>
                <stop offset="1" stop-color="rgba(215,155,255,.96)"/>
              </linearGradient>
              <linearGradient id="frost" x1="0" x2="0" y1="0" y2="1">
                <stop offset="0" stop-color="rgba(255,255,255,.98)"/>
                <stop offset="1" stop-color="rgba(255,255,255,.78)"/>
              </linearGradient>
              <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
                <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="rgba(0,0,0,.20)"/>
              </filter>
              <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
                <feGaussianBlur stdDeviation="2.2" result="b"/>
                <feMerge>
                  <feMergeNode in="b"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>

            <!-- plate -->
            <ellipse cx="280" cy="410" rx="240" ry="38" fill="rgba(255,255,255,.65)" filter="url(#softShadow)"/>

            <!-- bottom tier -->
            <g filter="url(#softShadow)">
              <rect x="85" y="245" width="390" height="150" rx="38" fill="url(#tierPink)"/>
              <path d="M110 265 C150 310 190 210 230 265 C270 310 310 210 350 265 C390 310 430 210 470 265"
                    fill="none" stroke="url(#frost)" stroke-width="28" stroke-linecap="round" opacity=".97"/>
              <g opacity=".9">
                <circle cx="145" cy="330" r="7" fill="rgba(255,255,255,.96)"/>
                <circle cx="210" cy="350" r="6" fill="rgba(255,255,255,.96)"/>
                <circle cx="280" cy="332" r="7" fill="rgba(255,255,255,.96)"/>
                <circle cx="350" cy="352" r="6" fill="rgba(255,255,255,.96)"/>
                <circle cx="420" cy="330" r="7" fill="rgba(255,255,255,.96)"/>
              </g>
            </g>

            <!-- middle tier -->
            <g filter="url(#softShadow)">
              <rect x="140" y="150" width="280" height="110" rx="32" fill="url(#tierBlue)"/>
              <path d="M170 175 C205 215 240 125 275 175 C310 215 345 125 380 175 C415 215 450 125 485 175"
                    transform="translate(-70,0)"
                    fill="none" stroke="rgba(255,255,255,.96)" stroke-width="22" stroke-linecap="round" opacity=".96"/>
            </g>

            <!-- top tier -->
            <g filter="url(#softShadow)">
              <rect x="190" y="75" width="180" height="95" rx="30" fill="url(#tierLav)"/>
              <path d="M220 105 C250 130 280 60 310 105 C340 130 370 60 400 105"
                    transform="translate(-20,0)"
                    fill="none" stroke="rgba(255,255,255,.96)" stroke-width="18" stroke-linecap="round" opacity=".96"/>
            </g>

            <!-- candle bodies -->
            <g filter="url(#glow)">
              <rect x="245" y="28" width="14" height="70" rx="7" fill="rgba(255,255,255,.95)"/>
              <rect x="273" y="18" width="14" height="80" rx="7" fill="rgba(255,255,255,.95)"/>
              <rect x="301" y="28" width="14" height="70" rx="7" fill="rgba(255,255,255,.95)"/>
            </g>
          </svg>

          <!-- Flames (animated) -->
          <div class="flames" aria-hidden="true">
            <div class="flame f1"></div>
            <div class="flame f2"></div>
            <div class="flame f3"></div>
          </div>

          <!-- Smoke (after blow) -->
          <div class="smoke" aria-hidden="true">
            <span class="p p1"></span>
            <span class="p p2"></span>
            <span class="p p3"></span>
          </div>
        </div>
      </section>

      <!-- ENVELOPE (appears after countdown) -->
      <div class="envelope-wrap" id="envelopeWrap" aria-hidden="true">
        <button class="envelope" id="envelope" type="button" aria-label="Open the envelope">
          <div class="env-shadow"></div>
          <div class="env-body">
            <div class="env-back"></div>
            <div class="env-front"></div>
            <div class="env-flap"></div>
          </div>
          <div class="env-label">Tap to open 💌</div>
        </button>
      </div>

      <!-- CARD (appears after envelope click, envelope disappears fully) -->
      <div class="card-wrap" id="cardWrap" aria-hidden="true">
        <div class="card" role="dialog" aria-label="Birthday message card">
          <div class="card-bg-decor" aria-hidden="true"></div>

          <div class="card-header">
            <div class="header-badge">🎉</div>
            <div class="header-text">
              <div class="header-title">Happy Birthday!</div>
              <div class="header-sub">Wishing you a beautiful year ahead</div>
            </div>
          </div>

          <div class="card-wave" aria-hidden="true">
            <svg viewBox="0 0 600 90" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M0,30 C90,70 160,5 250,35 C340,65 410,20 505,40 C560,52 590,60 600,62 L600,0 L0,0 Z"
                    fill="rgba(70,150,230,.18)"/>
              <path d="M0,48 C95,80 170,18 260,46 C350,74 425,30 520,52 C565,62 590,68 600,72 L600,0 L0,0 Z"
                    fill="rgba(70,150,230,.12)"/>
            </svg>
          </div>

          <div class="message" id="msg">
            Wishing you a day full of smiles, surprises, and sweet moments. 💛
          </div>

          <div class="from" id="from">— Someone who cares</div>

          <div class="card-footer">
            <span>🧁</span><span>✨</span><span>🎂</span><span>🎈</span><span>💙</span>
          </div>
        </div>
      </div>

      <audio id="pop" src="assets/pop.mp3" preload="auto"></audio>
    </section>

    <footer class="bottom">
      <div class="small">Instant digital surprise • Works on mobile & desktop</div>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
